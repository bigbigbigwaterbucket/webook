apiVersion: intrv1
kind: Service
metadata:
  name: webook
spec:
  # 如果是clusterIP就只能通过nginx访问，负载均衡器由于可以自动负载均衡，因此postman这种也可以访问
  type: LoadBalancer  # NodePort表示k8s所有实例服务映射成一个端口 loadBalancer则是负载均衡器
  selector:
    app: webook
  ports:
    - protocol: TCP
      name : http
      port: 8081
      targetPort: 8080



  