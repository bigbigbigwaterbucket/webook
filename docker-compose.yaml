version: "3.0"
services:
  mysql8:
    image: mysql:8.0.29  # 指定镜像，镜像相当于一个只读的原始文件，容器启动服务会基于镜像创建一个可写层，从而隔离不同服务
    # 容器 = 镜像+可写层+网络/进程环境+启动运行
    restart: always
    command:
      - --default_authentication_plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      #      设置初始化脚本，讲本地的./script/mysql/下的文件挂载到容器的/docker-entrypoint-initdb.d/目录下，该目录会在初始化时自动执行.sql脚本
      - ./script/mysql/:/docker-entrypoint-initdb.d/
    ports:
      #      把本机的13316端口映射到容器（虚拟化服务）的3306端口，容器的mysql服务，在本机访问13316，就相当于访问容器的3306端口
      - "13316:3306"
  redis:
    image: 'bitnami/redis:7.2'
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - '6379:6379'